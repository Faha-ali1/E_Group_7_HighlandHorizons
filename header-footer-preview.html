<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highland Horizons — Header &amp; Footer Preview</title>

  <!--
    Required shared CSS dependencies for all Highland Horizons pages:
    1. Bootstrap 5.3 CSS (must load before layout.css)
    2. assets/css/layout.css (automatically imports Libre Baskerville 400 & 700 and defines shared tokens)
  -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="assets/css/layout.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--hh-cream);
      font-family: var(--hh-font-serif);
      color: var(--hh-olive-green);
    }

    main.hh-preview-placeholder {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }

    .hh-preview-card {
      max-width: 640px;
      border: 1px dashed rgba(27, 94, 59, 0.35);
      border-radius: 10px;
      padding: 2.25rem 1.75rem;
      background-color: rgba(255, 255, 255, 0.55);
      text-align: center;
    }

    .hh-preview-card h1 {
      color: var(--hh-forest-green);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <!-- Shared Header Placeholder -->
  <div id="site-header"></div>

  <!-- Minimal Main-Content Placeholder for Preview -->
  <main class="hh-preview-placeholder">
    <div class="hh-preview-card">
      <h1>Header &amp; Footer Component Preview</h1>
      <p class="mb-2">
        This placeholder sits between the shared Highland Horizons header and footer.
      </p>
      <p class="small mb-0">
        Inspect at 390px, 768px, 992px, 1024px, 1200px, and 1440px to verify the finalized
        15-page navigation, dropdowns, search bar toggle, hamburger menu, and 4-column footer.
      </p>
    </div>
  </main>

  <!-- Shared Footer Placeholder -->
  <div id="site-footer"></div>

  <!--
    Required shared JavaScript dependencies for all Highland Horizons pages:
    1. Bootstrap 5.3 Bundle JS (includes Popper for dropdowns and mobile collapse)
    2. assets/js/layout.js (loads components/header.html and components/footer.html via fetch())
       Note: From a subfolder such as pages/about.html, use ../assets/js/layout.js (and ../assets/css/layout.css).
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
