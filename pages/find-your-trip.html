<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Trip — Highland Horizons</title>

  <!-- Bootstrap 5.3.3 CSS (exact CDN + integrity from header-footer-preview.html) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <!-- Shared layout styles first, then page-specific styles -->
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/find-your-trip.css">
</head>
<body data-base-path=".." data-hh-active-page="find-your-trip">
  <!-- Shared Header Placeholder (injected by assets/js/layout.js) -->
  <div id="site-header"></div>

  <main class="hh-quiz-main">
    <div class="container hh-quiz-container">
      <!-- Page Intro Header -->
      <header class="hh-quiz-header">
        <h1 class="hh-quiz-title">Find Your Trip</h1>
        <p class="hh-quiz-subtitle mb-0">
          Answer these questions and we&rsquo;ll match you with a destination.
        </p>
      </header>

      <!-- QUIZ SECTION: Questions, options, error, and navigation are rendered by JS -->
      <section id="quizSection" class="hh-quiz-section" aria-label="Trip finder quiz">
        <!-- Progress Indicator -->
        <div class="hh-progress-wrap">
          <p id="quizProgressLabel" class="hh-progress-label" aria-live="polite">
            Question 1 of 5
          </p>
          <div
            id="quizProgressBar"
            class="hh-progress-track"
            role="progressbar"
            aria-label="Quiz progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="20"
          >
            <div id="quizProgressFill" class="hh-progress-fill" style="width: 20%;"></div>
          </div>
        </div>

        <!-- Question Heading (referenced by radiogroup aria-labelledby) -->
        <h2 id="quizQuestionTitle" class="hh-question-heading"></h2>

        <!-- Option Cards Container (populated dynamically by find-your-trip.js) -->
        <div
          id="quizOptionsGrid"
          class="hh-options-grid"
          role="radiogroup"
          aria-labelledby="quizQuestionTitle"
        ></div>

        <!-- Inline Validation Error (announced to screen readers via aria-live) -->
        <p
          id="quizErrorMsg"
          class="hh-quiz-error"
          role="alert"
          aria-live="polite"
          hidden
        ></p>

        <!-- Quiz Navigation Controls -->
        <div class="hh-quiz-actions">
          <button
            type="button"
            id="quizBackBtn"
            class="btn hh-btn-back"
          >
            <span class="hh-btn-arrow-left" aria-hidden="true">&larr;</span>
            <span>Back</span>
          </button>

          <button
            type="button"
            id="quizNextBtn"
            class="btn hh-btn-next"
          >
            <span id="quizNextLabel">Next</span>
            <span class="hh-btn-arrow-right" aria-hidden="true">&rarr;</span>
          </button>
        </div>
      </section>

      <!-- RESULT SECTION: Shown once all 5 questions are answered (or restored from localStorage) -->
      <section
        id="resultSection"
        class="hh-result-section"
        aria-labelledby="resultHeading"
        hidden
      >
        <div class="hh-result-card">
          <div class="hh-result-media">
            <img
              id="resultImage"
              src="../assets/images/quiz-mountains.jpg"
              alt=""
              class="hh-result-img"
            >
          </div>

          <div class="hh-result-body">
            <p class="hh-result-eyebrow">Recommended Destination</p>
            <h2 id="resultHeading" class="hh-result-title">Your Match:</h2>
            <p id="resultDescription" class="hh-result-description"></p>

            <!-- Quick trip facts -->
            <dl class="hh-result-meta">
              <div class="hh-result-meta-item">
                <dt>Best Season</dt>
                <dd id="resultSeason"></dd>
              </div>
              <div class="hh-result-meta-item">
                <dt>Suggested Duration</dt>
                <dd id="resultDays"></dd>
              </div>
            </dl>

            <!-- Dynamic explanation built from user's selected answers -->
            <p id="resultWhyMatched" class="hh-result-why"></p>

            <div class="hh-result-actions">
              <a
                href="../pages/tour-packages.html"
                class="btn hh-btn-next hh-result-cta"
              >
                <span>View Package</span>
                <span class="hh-btn-arrow-right" aria-hidden="true">&rarr;</span>
              </a>

              <button
                type="button"
                id="retakeQuizBtn"
                class="btn hh-btn-back hh-result-retake"
              >
                Retake
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Shared Footer Placeholder (injected by assets/js/layout.js) -->
  <div id="site-footer"></div>

  <!-- Bootstrap 5.3.3 Bundle JS (exact CDN + integrity from header-footer-preview.html) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <!-- Shared layout loader first, then quiz logic -->
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/find-your-trip.js"></script>
</body>
</html>
